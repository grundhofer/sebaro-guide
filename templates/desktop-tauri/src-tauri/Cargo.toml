[package]
name = "musterapp-desktop"
version = "0.1.0"
description = "sebaro starter template: Musterapp Desktop (fictive), a Tauri 2 window on the sebaro web export"
license = "MIT"
edition = "2021"
rust-version = "1.80"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
