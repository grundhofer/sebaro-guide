name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated blocks and outputs are fresh
        run: python3 tools/build.py --check
      - name: Site checks (pages, links, no foreign requests, token-only CSS, rules)
        run: python3 tools/check_site.py
      - name: System files untouched since the export
        run: python3 tools/sync_from_design.py --verify-local
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: axe (WCAG 2.2 AA), overflow and console errors, light and dark, 390 and 1440 px
        run: node tools/check_a11y.mjs
