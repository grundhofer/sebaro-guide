# The three starter templates under templates/ (website-astro, webapp-vite, desktop-tauri): each job installs its
# template from its own package-lock.json, checks its copy of the sebaro web export (verify-export.mjs --strict),
# builds it and runs its Playwright tests in Chromium (every screen light and dark at 100 % and real 200 % text: axe
# with 0 violations, no sideways scroll, no cut text, no console or Content-Security-Policy error; keyboard paths).
# The desktop job also builds the Tauri app on Linux (debug, no bundle). Screenshots of every run are uploaded.
# Each template's copy of the export is a snapshot: a guide sync does not touch it; update it with npm run sebaro:sync.
# The iOS template (ios-swiftui, D112) runs on a GitHub-hosted macOS runner: its copy of the iOS export checked against
# its record (tools/sebaro-verify.py), the SwiftUI lint, the test judge's regression cases, swift build of the local
# package, the app built for the iOS simulator, and every test in a simulator (screenshots of every screen light and
# dark, default size and AX5, 393 and 320 pt, with the text check; behaviour). Its export copy is updated with tools/sebaro-sync.sh (needs the workshop).
name: templates
on:
  push:
    branches: [main]
    paths: ["templates/**", ".github/workflows/templates.yml"]
  pull_request:
    paths: ["templates/**", ".github/workflows/templates.yml"]
permissions:
  contents: read
jobs:
  website-astro:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/website-astro
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: templates/website-astro/package-lock.json
      - run: npm ci
      - name: sebaro export unchanged (verify-export.mjs --strict)
        run: npm run sebaro:verify
      - run: npx playwright install --with-deps chromium
      - name: Build (share images with render.mjs, then astro build)
        run: npm run build
      - name: Screens (light/dark, 320/390/1440 px, 100/200 % text, axe, overflow, cut text, CSP) and keyboard
        run: npm test
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-astro-screens
          path: templates/website-astro/test-results/
          retention-days: 7
          if-no-files-found: ignore

  webapp-vite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/webapp-vite
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: templates/webapp-vite/package-lock.json
      - run: npm ci
      - name: sebaro export unchanged (verify-export.mjs --strict)
        run: npm run sebaro:verify
      - run: npx playwright install --with-deps chromium
      - name: Build (tsc + vite)
        run: npm run build
      - name: Screens (light/dark, 320/390/1440 px, 100/200 % text, axe, overflow, cut text, CSP) and keyboard
        run: npm test
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webapp-vite-screens
          path: templates/webapp-vite/test-results/
          retention-days: 7
          if-no-files-found: ignore

  desktop-tauri:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/desktop-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: templates/desktop-tauri/package-lock.json
      - name: Tauri system packages (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Rust toolchain (rustup is on the runner image)
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: templates/desktop-tauri/src-tauri -> target
      - run: npm ci
      - name: sebaro export unchanged (verify-export.mjs --strict)
        run: npm run sebaro:verify
      - name: Frontend build (tsc + vite)
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Screens (light/dark, 390/480/1440 px, 100/200 % text, axe, overflow, cut text, CSP) and keyboard
        run: npm test
      - name: Tauri app builds on Linux (debug, no bundle)
        run: npx tauri build --debug --no-bundle
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-tauri-screens
          path: templates/desktop-tauri/test-results/
          retention-days: 7
          if-no-files-found: ignore

  ios-swiftui:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: templates/ios-swiftui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Xcode and simulators on the runner
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - name: sebaro export unchanged (every file against sebaro-export.json, nothing else in the folder)
        run: python3 tools/sebaro-verify.py
      - name: SwiftUI lint (no system look, no raw colours or sizes, no shadows, pills or system fonts)
        run: ./tools/lint-sebaro-ios.sh
      - name: Test judge and runner regression cases (bundle Failed, incomplete log, unexpected exit, timeout …)
        run: ./tools/test-result-fixtures/check.sh
      - name: Local package builds (swift build)
        run: swift build --package-path SebaroDesign --scratch-path "$RUNNER_TEMP/spm"
      - name: App builds for the iOS simulator
        run: |
          xcodebuild build -project Musterapp.xcodeproj -scheme Musterapp \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd-build" \
            CODE_SIGNING_ALLOWED=NO
      - name: Tests in a simulator (screens light/dark, default and AX5, 393 and 320 pt, text check; behaviour)
        run: ./tools/run-tests.sh
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-swiftui-screens
          path: |
            templates/ios-swiftui/build/test/shots/
            templates/ios-swiftui/build/test/xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore
