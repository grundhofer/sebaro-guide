<div class="g-examples">
  <div class="g-ex g-ex--do"><p class="g-ex__label"><svg class="sb-icon sb-icon--16" aria-hidden="true" focusable="false"><use href="#check--16"/></svg>So</p><div class="g-ex__stage">
    <div class="g-rx-spaced">
      <div class="sb-field"><label class="sb-field__label" for="RAU-01-name">Name</label><div class="sb-field__control"><input id="RAU-01-name" type="text" value="Lesen" autocomplete="off"></div></div><span></span>
      <span></span><span class="g-rx-gap g-rx-gap--stack"><span>12 · stack</span></span>
      <div class="sb-field"><label class="sb-field__label" for="RAU-01-goal">Tagesziel</label><div class="sb-field__control"><input id="RAU-01-goal" type="text" inputmode="numeric" value="20" autocomplete="off"><span class="sb-field__suffix">Min.</span></div></div><span></span>
      <span></span><span class="g-rx-gap g-rx-gap--group"><span>24 · group</span></span>
      <div class="sb-field"><label class="sb-field__label" for="RAU-01-time">Erinnerung um</label><div class="sb-field__control"><input id="RAU-01-time" type="text" value="19:00" autocomplete="off"></div></div><span></span>

      <div class="sb-field"><label class="sb-field__label" for="RAU-01-name-x">Name</label><div class="sb-field__control"><input id="RAU-01-name-x" type="text" value="Lesen" autocomplete="off"></div></div><span></span>

      <span></span><span class="g-rx-gap g-rx-gap--10"><span>10&nbsp;px</span></span>
      <div class="sb-field"><label class="sb-field__label" for="RAU-01-time-x">Erinnerung um</label><div class="sb-field__control"><input id="RAU-01-time-x" type="text" value="19:00" autocomplete="off"></div></div><span></span>
    </div>
