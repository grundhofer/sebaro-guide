<div class="g-examples">
  <div class="g-ex g-ex--do"><p class="g-ex__label"><svg class="sb-icon sb-icon--16" aria-hidden="true" focusable="false"><use href="#check--16"/></svg>So</p><div class="g-ex__stage">
    <div class="g-rx-stack g-rx-stack--stretch">
      <div class="sb-field"><label class="sb-field__label" for="FAR-05-name">Name</label><div class="sb-field__control"><input id="FAR-05-name" type="text" value="Wasser trinken" autocomplete="off"></div></div>
      <div class="sb-field"><label class="sb-field__label" for="FAR-05-goal">Tagesziel</label><div class="sb-field__control"><input id="FAR-05-goal" type="text" inputmode="numeric" value="8" autocomplete="off"><span class="sb-field__suffix">Gläser</span></div></div>
    </div>
  </div><p class="g-ex__note">Die Seite liegt auf bg, nur die Felder tragen surface-sunken; so hebt sich jedes Feld klar ab.</p></div>
  <div class="g-ex g-ex--dont"><p class="g-ex__label"><svg class="sb-icon sb-icon--16" aria-hidden="true" focusable="false"><use href="#close--16"/></svg>Nicht so</p><div class="g-ex__stage">

      <div class="sb-field"><label class="sb-field__label" for="FAR-05-name-x">Name</label><div class="sb-field__control"><input id="FAR-05-name-x" type="text" value="Wasser trinken" autocomplete="off"></div></div>
